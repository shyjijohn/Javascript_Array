<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pictures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="noise"></div>

  <header>
    <h1 class="logo">Pictures</h1>
  </header>

  <main>
    <!-- Stage: Current Image -->
    <div class="stage" id="stage">

      <div class="image-frame">
        <div class="image-loader" id="imageLoader">
          <div class="loader-ring"></div>
        </div>
        <img id="currentImage" alt="Current image" style="display:none;" />
        <div class="image-meta" id="imageMeta"></div>
      </div>

      <div class="assign-panel">
        <p class="assign-label">Assign this image to an email address</p>
        <div class="input-group">
          <input
            type="email"
            id="emailInput"
            placeholder="sample@gmail.com"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="input-error" id="inputError"></div>
        </div>
        <div class="btn-group">
          <button id="assignBtn" class="btn-primary" disabled>
            <span class="btn-text">Assign</span>
          </button>
          <button id="nextBtn" class="btn-secondary" disabled>
            <span class="btn-text">Next</span>
            <span class="btn-arrow">→</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Gallery: Assigned Images -->
    <div class="gallery-section" id="gallerySection" style="display:none;">
      <div class="gallery-header">
        <h2>Collection</h2>
        <span class="gallery-count" id="galleryCount"></span>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
